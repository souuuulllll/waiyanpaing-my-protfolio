<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --color-Navy-950: hsl(233, 47%, 7%);
        --color-Blue-950: hsl(244, 37%, 16%);
        --color-Purple-500: hsl(277, 64%, 61%);
        --color-main-heading: hsl(0, 0%, 100%);
        --color-main-paragraph: hsla(0, 0%, 100%, 0.75);
        --color-stat-headings: hsla(0, 0%, 100%, 0.6);
      }
      * {
        font-family: "Lexend Deca", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
      }
      h2,
      h3 {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="bg-Navy-950 w-screen min-h-screen grid place-items-center">
      <div
        class="bg-Blue-950 max-w-5xl grid lg:grid-cols-2 rounded-xl overflow-hidden my-20 mx-8"
      >
        <div class="py-8 px-4 lg:px-10 order-2 lg:order-1 lg:p-13">
          <div class="">
            <h2 class="text-main-heading text-3xl text-center lg:text-4xl lg:font-bold lg:text-left">
              Get <span class="text-Purple-500">insights</span> that help your
              business grow.
            </h2>
            <p class="text-main-paragraph leading-6 mt-8 text-center lg:text-left">
              Discover the benefits of data analytics and make better decisions
              regarding revenue, customer experience, and overall efficiency.
            </p>
          </div>
          <div class="grid gap-5 justify-center lg:grid-cols-3 mt-16">
            <div>
              <h3 class="lg:text-left text-center text-main-heading text-2xl font-bold">10k+</h3>
              <p
                class="text-stat-headings mt-2 uppercase text-xs tracking-widest"
              >
                Companies
              </p>
            </div>
            <div>
              <h3 class="lg:text-left text-center text-main-heading text-2xl font-bold">314</h3>
              <p
                class="text-stat-headings mt-2 uppercase text-xs tracking-widest"
              >
                Templates
              </p>
            </div>
            <div>
              <h3 class="lg:text-left text-main-heading text-2xl font-bold">12M+</h3>
              <p
                class="text-stat-headings mt-2 uppercase text-xs tracking-widest"
              >
                Queries
              </p>
            </div>
          </div>
        </div>
        <div
          class=" order-1 lg:order-2 lg:aspect-auto bg-Purple-500 bg-[url(/images/image-header-desktop.jpg)] aspect-video bg-cover bg-blend-multiply"
        ></div>
      </div>
    </div>
  </body>
</html>
