<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="container">
      <div class="card">
        <div class="box">
        <img src="images/icon-view.svg" alt="img" class="small-img" />
        </div>
        <h2>Equilibrium #3429</h2>
        <p class="description">Our Equilibrium collection promotes balance and calm.</p>
        <div class="item">
          <div class="ethe-item">
          <img src="images/icon-ethereum.svg" alt="icon" />
          <h5>0.041ETH</h5>
          </div>
          <div class="clock-item">
          <img src="images/icon-clock.svg" alt="icon" />
          <h5>3 days left</h5>
          </div>
        </div>
        <hr />
        <div class="profile">
        <img src="images/image-avatar.png" alt="img" />
        <p>Creation of <b>Jules Wyvern</b></p>
        </div>
      </div>
    </section>
  </body>
</html>
