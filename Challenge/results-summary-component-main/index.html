<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>
<link rel="stylesheet" href="css/style.css">
    </style>
  </head>
  <body>
    <section class="main-page">
      <div class="container">
        <div class="card">
          <h4>Your Result</h4>
          <div class="card-circle">
            <div class="card-msg">
            <h2>76</h2>
            <p>of 100</p>
            </div>
          </div>
          <h3>Great</h3>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
        <div class="box">
          <h4>Summary</h4>
          <div class="item">
            <div class="box-item">
              <div class="content1">
                <img src="assets/images/icon-reaction.svg" alt="icon" />
                <p>Reaction</p>
              </div>
              <div class="content2">
                <p>80 / 100</p>
              </div>
            </div>
            <div class="box-item">
              <div class="content1">
                <img src="assets/images/icon-memory.svg" alt="icon" />
                <p>Memory</p>
              </div>
              <div class="content2">
                <p>92 / 100</p>
              </div>
            </div>
            <div class="box-item">
              <div class="content1">
                <img src="assets/images/icon-verbal.svg" alt="icon" />
                <p>Verbal</p>
              </div>
              <div class="content2">
                <p>61 / 100</p>
              </div>
            </div>
            <div class="box-item">
              <div class="content1">
                <img src="assets/images/icon-visual.svg" alt="icon" />
                <p>Visual</p>
              </div>
              <div class="content2">
                <p>73 / 100</p>
              </div>
            </div>
          </div>
          <button>Continue</button>
        </div>
      </div>
    </section>
  </body>
</html>
