<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="container">
      <img src="images/bg-pattern-top.svg" alt="img" class="top-img">
      <img src="images/bg-pattern-bottom.svg" alt="img" class="bottom-img">
      <div class="card">
        <div class="box">
          <img src="images/bg-pattern-card.svg" alt="img" class="box-img"/>
        </div>
        <img src="images/image-victor.jpg" alt="img" class="profile-img" />
        <div class="box2">
        <h2>Victor Crest <b>26</b></h2>
        <p>London</p>
        </div>
        <hr>
        <div class="item">
          <div class="item-msg">
            <h3>80K</h3>
            <p>Followers</p>
          </div>
          <div class="item-msg">
            <h3>803K</h3>
            <p>Likes</p>
          </div>
          <div class="item-msg">
            <h3>1.4K</h3>
            <p>Photos</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
